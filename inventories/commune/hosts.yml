# Plateforme commune ANINF — 16 VM, VLAN 2035 (100.64.35.0/24).
#
# Adresses : tableau des machines remis par l'ANINF le 15/10/2026.
#   zimbra_ip : adresse dans le VLAN 2035 ; Ansible s'y connecte directement
#               depuis msg-imapsync (ansible_host = zimbra_ip, group_vars/all).
# Tant que aninf_machine_table_received n'est pas à true (group_vars/all/main.yml),
# les playbooks s'arrêtent au contrôle préalable.
#
# msg-zmpres (instance tout-en-un de la Présidence) n'est PAS ici : elle a son
# propre inventaire, inventories/zmpres/hosts.yml, et son playbook
# playbooks/zmpres.yml (aucun lien avec la plateforme commune, fiche §5).
#
# L'ordre des hôtes dans chaque groupe compte : le premier LDAP est le
# premier maître, le premier serveur de boîtes porte le journal central.
all:
  children:
    zimbra_commune:
      children:
        zimbra_ldap:
          hosts:
            msg-ldap-1: { zimbra_ip: 100.64.35.19, ldap_server_id: 1 }
            msg-ldap-2: { zimbra_ip: 100.64.35.12, ldap_server_id: 2 }
            msg-ldap-3: { zimbra_ip: 100.64.35.5, ldap_server_id: 3 }
        zimbra_lds:
          hosts:
            msg-zimbra-license: { zimbra_ip: 100.64.35.8 }
        zimbra_mta:
          hosts:
            msg-mta-1: { zimbra_ip: 100.64.35.9 }
            msg-mta-2: { zimbra_ip: 100.64.35.6 }
            msg-mta-3: { zimbra_ip: 100.64.35.11 }
        zimbra_proxy:
          hosts:
            msg-proxy-1: { zimbra_ip: 100.64.35.10 }
            msg-proxy-2: { zimbra_ip: 100.64.35.17 }
            msg-proxy-3: { zimbra_ip: 100.64.35.15 }
        zimbra_mailbox:
          hosts:
            msg-mailbox-1: { zimbra_ip: 100.64.35.16 }
            msg-mailbox-2: { zimbra_ip: 100.64.35.3 }
            msg-mailbox-3: { zimbra_ip: 100.64.35.7 }
            msg-mailbox-4: { zimbra_ip: 100.64.35.14 }
            msg-mailbox-5: { zimbra_ip: 100.64.35.18 }
            msg-mailbox-6: { zimbra_ip: 100.64.35.2 }
