[defaults]
inventory = inventories/commune/hosts.yml
roles_path = roles
interpreter_python = /usr/bin/python3
callback_result_format = yaml
forks = 10
# Les installations Zimbra sont longues : on garde les journaux côté contrôleur.
log_path = ./ansible.log

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
# Ansible est lancé depuis msg-imapsync, joint par Teleport (fiche §3.4).
# De là, les serveurs Zimbra sont joints directement en SSH par leur adresse
# dans le VLAN 2035 (échanges internes libres, §4.5).
# accept-new : la clé d'hôte est enregistrée à la première connexion, puis vérifiée.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = true
