[defaults]
inventory = inventories/commune/hosts.yml
roles_path = roles
interpreter_python = /usr/bin/python3
callback_result_format = yaml
forks = 20
log_path = ./desinstallation.log

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
# Lancé depuis msg-imapsync, comme le projet d'installation ANINFZimbra10.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = true
