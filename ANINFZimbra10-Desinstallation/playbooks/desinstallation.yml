---
# =============================================================================
# DÉSINSTALLATION DE ZIMBRA — DESTRUCTIF ET IRRÉVERSIBLE
# Retire Zimbra et EFFACE ses données (annuaire, boîtes, messages) sur les
# serveurs visés. Aucune sauvegarde n'est faite par ce playbook.
#
# La cible se donne par -e cible=<motif Ansible> (pas par --limit, qui
# sauterait l'étape de confirmation) :
#   tout le cluster   : ansible-playbook playbooks/desinstallation.yml -e cible=all
#   un groupe         : ansible-playbook playbooks/desinstallation.yml -e cible=zimbra_mta
#   un serveur        : ansible-playbook playbooks/desinstallation.yml -e cible=msg-mta-2
#   Présidence        : ansible-playbook -i inventories/zmpres/hosts.yml playbooks/desinstallation.yml -e cible=all
#
# Ordre : inverse de l'installation (boîtes → proxys → MTA → licence →
# annuaires), pour que les annuaires restent joignables jusqu'au bout.
# =============================================================================

- name: Confirmation de la désinstallation
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    _targets: "{{ query('ansible.builtin.inventory_hostnames', cible | default('aucune_cible')) | reject('equalto', 'localhost') | list }}"
  tasks:
    - name: Cible explicite
      ansible.builtin.assert:
        that:
          - cible is defined
          - _targets | length > 0
        fail_msg: >-
          Préciser la cible avec -e cible=<serveur|groupe|all>
          (exemples : cible=msg-mta-2, cible=zimbra_mta, cible=all).

    - name: Serveurs visés
      ansible.builtin.debug:
        msg: "{{ _targets | map('extract', hostvars, 'zimbra_ip') | zip(_targets) | map('join', '  ') | list }}"

    - name: Confirmation
      ansible.builtin.pause:
        prompt: |

          ATTENTION : Zimbra va être désinstallé et SES DONNÉES EFFACÉES
          (annuaire, boîtes, messages) sur les {{ _targets | length }} serveur(s) ci-dessus.
          Cette opération est irréversible.

          Pour continuer, taper exactement : DETRUIRE {{ _targets | length }}
      register: _answer

    - name: Réponse attendue
      ansible.builtin.assert:
        that: (_answer.user_input | trim) == ('DETRUIRE ' ~ (_targets | length))
        fail_msg: "Réponse « {{ _answer.user_input | trim }} » : désinstallation annulée, rien n'a été modifié."

    - name: Confirmation enregistrée
      ansible.builtin.set_fact:
        _uninstall_confirmed: true

- name: Serveurs de boîtes
  hosts: "zimbra_mailbox:&{{ cible | default('aucune_cible') }}"
  roles: [zimbra_uninstall]

- name: Proxys
  hosts: "zimbra_proxy:&{{ cible | default('aucune_cible') }}"
  roles: [zimbra_uninstall]

- name: MTA
  hosts: "zimbra_mta:&{{ cible | default('aucune_cible') }}"
  roles: [zimbra_uninstall]

- name: Service de licence
  hosts: "zimbra_lds:&{{ cible | default('aucune_cible') }}"
  roles: [zimbra_uninstall]

- name: Annuaires
  hosts: "zimbra_ldap:&{{ cible | default('aucune_cible') }}"
  roles: [zimbra_uninstall]

- name: Instance tout-en-un de la Présidence
  hosts: "zimbra_single:&{{ cible | default('aucune_cible') }}"
  roles: [zimbra_uninstall]
