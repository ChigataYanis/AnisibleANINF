---
- name: Redémarrage des services Zimbra
  ansible.builtin.command: /opt/zimbra/bin/zmcontrol restart
  become_user: zimbra
  # Le répertoire personnel de zimbra (/opt/zimbra) appartient à root : Ansible
  # ne peut pas y créer .ansible_async. Le suivi asynchrone va dans /tmp.
  vars:
    ansible_async_dir: /tmp/.ansible_async_zimbra
  async: 1800
  poll: 15
  changed_when: true

- name: Tous les services sont démarrés
  ansible.builtin.command: /opt/zimbra/bin/zmcontrol status
  become_user: zimbra
  register: _status
  changed_when: false
  retries: 6
  delay: 20
  until: _status.rc == 0
