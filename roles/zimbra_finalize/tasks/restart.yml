---
- name: Redémarrage des services Zimbra
  ansible.builtin.command: /opt/zimbra/bin/zmcontrol restart
  become_user: zimbra
  async: 1800
  poll: 15
  changed_when: true

- name: Tous les services sont démarrés
  ansible.builtin.command: /opt/zimbra/bin/zmcontrol status
  become_user: zimbra
  register: _status
  changed_when: false
  retries: 6
  delay: 20
  until: _status.rc == 0
