---
# Images de personnalisation, déposées dans files/branding/ du projet.
# PROVISOIRE : images CNPS, en attendant celles de l'ANINF. Pour les
# remplacer, déposer les nouvelles images sous les mêmes noms et relancer
# avec --tags branding.
zimbra_branding_src_dir: "{{ inventory_dir }}/../../files/branding"
zimbra_branding_images:
  app_banner: AppBanner.png           # bandeau de l'application (125 x 35)
  login_banner: LoginBanner.png       # logo de la page de connexion (646 x 159)
  login_background: LoginBackground.png

# Application web Zimbra sur les serveurs de boîtes
zimbra_webapp_dir: /opt/zimbra/jetty_base/webapps/zimbra
zimbra_branding_dest_subdir: skins/_base/logos/aninf
zimbra_branding_url_path: "/{{ zimbra_branding_dest_subdir }}"

# Domaines personnalisés, et lien du logo
zimbra_branding_domains: ["{{ zimbra_default_domain }}"]
zimbra_branding_logo_url: ""

# Attribut de domaine portant le fond de la page de connexion de l'interface
# moderne : À CONFIRMER sur la 10.1.21. Vide = l'image est copiée, sans réglage.
zimbra_branding_background_attribute: ""
