---
# Logos et fond de connexion : copiés sur chaque serveur de boîtes (le webmail
# y est servi), puis déclarés une fois par domaine dans l'annuaire.
# Un correctif Zimbra peut réécrire l'application web : relancer --tags branding.

- name: Images de personnalisation présentes sur le poste de contrôle
  ansible.builtin.stat:
    path: "{{ zimbra_branding_src_dir }}/{{ item }}"
  loop: "{{ zimbra_branding_images.values() | list }}"
  register: _imgs
  delegate_to: localhost
  become: false
  run_once: true

- name: Images disponibles
  ansible.builtin.assert:
    that: _imgs.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: "Images manquantes dans {{ zimbra_branding_src_dir }} : {{ _imgs.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
  run_once: true

- name: Copie des images sur les serveurs de boîtes
  when: inventory_hostname in zimbra_mailbox_hosts
  block:
    - name: Application web Zimbra présente
      ansible.builtin.stat:
        path: "{{ zimbra_webapp_dir }}"
      register: _webapp
      failed_when: not _webapp.stat.exists

    - name: Répertoire des images
      ansible.builtin.file:
        path: "{{ zimbra_webapp_dir }}/{{ zimbra_branding_dest_subdir }}"
        state: directory
        owner: zimbra
        group: zimbra
        mode: "0755"

    - name: Images
      ansible.builtin.copy:
        src: "{{ zimbra_branding_src_dir }}/{{ item }}"
        dest: "{{ zimbra_webapp_dir }}/{{ zimbra_branding_dest_subdir }}/{{ item }}"
        owner: zimbra
        group: zimbra
        mode: "0644"
      loop: "{{ zimbra_branding_images.values() | list }}"

- name: Déclaration des logos par domaine
  ansible.builtin.command: >-
    /opt/zimbra/bin/zmprov md {{ item }}
    zimbraSkinLogoAppBanner {{ zimbra_branding_url_path }}/{{ zimbra_branding_images.app_banner }}
    zimbraSkinLogoLoginBanner {{ zimbra_branding_url_path }}/{{ zimbra_branding_images.login_banner }}
    {% if zimbra_branding_logo_url | length > 0 %}zimbraSkinLogoURL {{ zimbra_branding_logo_url }}{% endif %}
    {% if zimbra_branding_background_attribute | length > 0 %}{{ zimbra_branding_background_attribute }} {{ zimbra_branding_url_path }}/{{ zimbra_branding_images.login_background }}{% endif %}
  become_user: zimbra
  loop: "{{ zimbra_branding_domains }}"
  when: inventory_hostname == zimbra_mailbox_hosts[0]
  changed_when: true

- name: Prise en compte sans redémarrage
  ansible.builtin.command: /opt/zimbra/bin/zmprov flushCache -a {{ item }}
  become_user: zimbra
  loop: [domain, skin]
  when: inventory_hostname == zimbra_mailbox_hosts[0]
  changed_when: true
