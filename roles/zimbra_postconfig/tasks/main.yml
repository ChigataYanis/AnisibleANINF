---
# Réglages globaux (annuaire) : à jouer sur un seul serveur de boîtes.

# Filet de sécurité : domaine par défaut et compte administrateur. Créés à
# l'installation du premier serveur de boîtes ; créés ici s'ils manquent
# (plateforme installée avant ce correctif, ou étape sautée).
- name: Domaine {{ zimbra_default_domain }} présent
  ansible.builtin.command: su - zimbra -c "/opt/zimbra/bin/zmprov -l gd {{ zimbra_default_domain }} zimbraDomainName"
  register: _domain
  changed_when: false
  failed_when: false

- name: Création du domaine {{ zimbra_default_domain }}
  ansible.builtin.command: su - zimbra -c "/opt/zimbra/bin/zmprov -l cd {{ zimbra_default_domain }}"
  when: _domain.rc != 0
  changed_when: true

- name: Compte {{ zimbra_admin_account }} présent
  ansible.builtin.command: su - zimbra -c "/opt/zimbra/bin/zmprov -l ga {{ zimbra_admin_account }} zimbraIsAdminAccount"
  register: _admin
  changed_when: false
  failed_when: false

# Mot de passe passé par l'environnement, jamais en clair dans la commande.
- name: Création du compte administrateur {{ zimbra_admin_account }}
  ansible.builtin.shell: >-
    su - zimbra -c '/opt/zimbra/bin/zmprov ca {{ zimbra_admin_account }} "$ZM_ADMIN_PW"
    zimbraIsAdminAccount TRUE' -w ZM_ADMIN_PW
  environment:
    ZM_ADMIN_PW: "{{ zimbra_admin_password }}"
  when: _admin.rc != 0
  no_log: true
  changed_when: true

- name: Le compte {{ zimbra_admin_account }} est administrateur
  ansible.builtin.command: su - zimbra -c "/opt/zimbra/bin/zmprov -l ga {{ zimbra_admin_account }} zimbraIsAdminAccount"
  register: _admin_after
  changed_when: false
  failed_when: "'zimbraIsAdminAccount: TRUE' not in _admin_after.stdout"

- name: FortiMail renseignés
  ansible.builtin.debug:
    msg: >-
      ATTENTION : fortimail_relay_host / fortimail_ips / fortimail_smtp_hostnames
      ne sont pas renseignés. Le relais et l'envoi du webmail par les FortiMail
      ne sont pas configurés ; à rejouer avec --tags postconfig une fois fournis.
  when: fortimail_relay_host | length == 0 or fortimail_ips | length == 0
        or fortimail_smtp_hostnames | length == 0

- name: Script zmprov
  ansible.builtin.template:
    src: postconfig.zmprov.j2
    dest: "{{ zimbra_state_dir | default('/var/lib/zimbra-ansible') }}/postconfig.zmprov"
    owner: zimbra
    mode: "0600"

- name: Répertoire des témoins lisible par zimbra
  ansible.builtin.file:
    path: "{{ zimbra_state_dir | default('/var/lib/zimbra-ansible') }}"
    mode: "0711"

- name: Application des réglages
  ansible.builtin.command: /opt/zimbra/bin/zmprov -f {{ zimbra_state_dir | default('/var/lib/zimbra-ansible') }}/postconfig.zmprov
  become_user: zimbra
  changed_when: true

- name: Antivirus, antispam et DKIM retirés des MTA
  ansible.builtin.shell: |
    set -euo pipefail
    for h in {{ zimbra_mta_hosts | map('regex_replace', '$', '.' ~ zimbra_hosts_domain) | join(' ') }}; do
      enabled=$(/opt/zimbra/bin/zmprov gs "$h" zimbraServiceEnabled)
      for s in {{ zimbra_mta_disabled_services | join(' ') }}; do
        if grep -qx "zimbraServiceEnabled: $s" <<<"$enabled"; then
          /opt/zimbra/bin/zmprov ms "$h" -zimbraServiceEnabled "$s"
          echo "CHANGED $h $s"
        fi
      done
    done
  args:
    executable: /bin/bash
  become_user: zimbra
  register: _svc
  changed_when: "'CHANGED' in _svc.stdout"

- name: Listes noires DNS (DNSBL) retirées des restrictions MTA
  ansible.builtin.shell: |
    set -euo pipefail
    /opt/zimbra/bin/zmprov gacf zimbraMtaRestriction \
      | sed -n 's/^zimbraMtaRestriction: //p' \
      | { grep -E '^reject_(rbl_client|rhsbl_)' || true; } \
      | while read -r r; do
          /opt/zimbra/bin/zmprov mcf -zimbraMtaRestriction "$r"
          echo "CHANGED $r"
        done
  args:
    executable: /bin/bash
  become_user: zimbra
  register: _rbl
  changed_when: "'CHANGED' in _rbl.stdout"
